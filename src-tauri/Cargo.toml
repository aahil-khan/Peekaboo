[package]
name = "peekaboo-app"
version = "0.1.0"
description = "Peekaboo — instant AI overlay"
authors = ["Aahil Khan"]
license = "MIT"
edition = "2021"

[lib]
name = "peekaboo_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
# unsafe-headers lets the frontend drop the Origin header the plugin otherwise
# stamps on every request; see src/providers/http.ts.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
image = "0.25.10"
base64 = "0.22.1"
arboard = "3.6.1"
rfd = "0.15"
toml = "0.8"
# Built-in plugins are compiled into the binary rather than copied to the user's
# config directory on first run. A copy would silently go stale on upgrade.
include_dir = "0.7"
sysinfo = "0.33"
# Text extraction for /file. Parses documents Peekaboo did not produce and
# panics on some malformed ones, so every call is wrapped in catch_unwind.
pdf-extract = "0.12"

# Screen capture goes through xdg-desktop-portal. GNOME 50 denies the private
# org.gnome.Shell.Screenshot API ("ScreenshotArea is not allowed"), so the
# portal is the only working path — and it is the portable one anyway.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "remote_desktop", "screencast"] }
url = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
# Paste-back on X11 (and into Xwayland apps): XTest key events plus the input
# focus check that makes them safe. Already in the tree through arboard; this
# only switches on the extension.
x11rb = { version = "0.13", features = ["xtest"] }

# Selection capture (synthesised Ctrl+C) and paste-back (SendInput) on Windows,
# with the raw clipboard API so every format survives the save and restore.
# Already in the tree through arboard and Tauri.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

# Selection capture (Accessibility API) and paste-back (CGEvent) on macOS.
# All already in the tree through Tauri and arboard.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
