<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peekaboo</title>
    <script>
      /*
       * Stamps the theme and window kind onto <html> before anything paints.
       *
       * This deliberately duplicates a few lines of src/lib/theme.ts and
       * src/lib/windowLabel.ts. Those live in the deferred module bundle, which
       * arrives a frame or two after first paint — long enough to show a flash
       * of the wrong theme, and (for the settings/setup windows) a flash of the
       * transparent overlay background. Keep the three in sync.
       */
      (function () {
        var el = document.documentElement;

        /* Only the light/dark counterparts need to be known this early; the
           full registry lives in src/lib/themes.ts. Keep these pairs in sync
           with the `pairedWith` fields there. */
        var PAIRS = {
          'peek-dark': ['dark', 'peek-light'],
          'peek-light': ['light', 'peek-dark'],
          'catppuccin-mocha': ['dark', 'catppuccin-latte'],
          'catppuccin-macchiato': ['dark', 'catppuccin-latte'],
          'catppuccin-latte': ['light', 'catppuccin-mocha'],
          'tokyo-night': ['dark', 'tokyo-night-day'],
          'tokyo-night-day': ['light', 'tokyo-night'],
          'nord': ['dark', 'peek-light'],
          'gruvbox-dark': ['dark', 'gruvbox-light'],
          'gruvbox-light': ['light', 'gruvbox-dark'],
          'rose-pine': ['dark', 'rose-pine-dawn'],
          'rose-pine-dawn': ['light', 'rose-pine'],
          'solarized-dark': ['dark', 'solarized-light'],
          'solarized-light': ['light', 'solarized-dark']
        };

        try {
          var persisted = JSON.parse(localStorage.getItem('peekaboo-settings') || '{}').state || {};
          var id = persisted.themeId || 'peek-dark';
          if (!PAIRS[id]) id = 'peek-dark';

          if (persisted.followSystem) {
            var want = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (PAIRS[id][0] !== want) id = PAIRS[id][1];
          }

          el.dataset.theme = id;
          el.dataset.appearance = PAIRS[id][0];
          if (persisted.themeAccent && persisted.themeAccent !== 'auto') {
            el.dataset.accent = persisted.themeAccent;
          }
        } catch (e) {
          el.dataset.theme = 'peek-dark';
          el.dataset.appearance = 'dark';
        }

        /* Same field @tauri-apps/api reads, just read early enough to matter. */
        var label = 'peekaboo';
        try {
          label = window.__TAURI_INTERNALS__.metadata.currentWindow.label;
        } catch (e) {}
        el.dataset.window = label === 'settings' || label === 'setup' ? label : 'peek';
      })();
    </script>
    <style>
      /*
       * Critical CSS. src/index.css ships with the module bundle, so these few
       * values are inlined to cover the gap before it lands. They mirror
       * --peek-bg-solid and --peek-text for each theme; update both together.
       */
      html,
      body {
        background: transparent;
      }
      html[data-window='settings'],
      html[data-window='setup'] {
        background: #18181b;
        color: #fafafa;
      }
      html[data-appearance='light'][data-window='settings'],
      html[data-appearance='light'][data-window='setup'] {
        background: #f4f4f5;
        color: #18181b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
